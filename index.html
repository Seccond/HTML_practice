<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="media-info-msg">화면 크기를 줄여주세요!</div>
    <header>
      <div class="info-bar">
        <div class="info-bar__time">20:55</div>
        <div class="info-bar__icons">
          <img src="assets/chart-bar.svg" alt="chart-bar" />
          <img src="assets/wifi.svg" alt="wifi" />
          <img src="assets/battery.svg" alt="battery" />
        </div>
      </div>
      <div class="menu-bar">
        <div class="menu-bar__location">
          <span>역삼1동</span>
          <div class="menu-bar__location--icons">
            <img src="assets/arrow-down.svg" alt="arrow-down" />
          </div>
        </div>

        <div class="menu-bar__icons">
          <img src="assets/search.svg" alt="search" />
          <img src="assets/menu-bar.svg" alt="menu" />
          <img src="assets/bell.svg" alt="bell" />
        </div>
      </div>
    </header>

    <main>
      <div class="items">
        <div class="item-list">
          <div class="item-list__img">
            <img src="assets/photo.svg" alt="photo" />
          </div>
          <div class="item-list__info">
            <div class="item-list__info-name">
              이건 1번 상품입니다. 구매해주세요
            </div>
            <div class="item-list__info-loc">지역6</div>
            <div class="item-list__info-price">100만원</div>
          </div>
        </div>
        <div class="item-list">
          <div class="item-list__img">
            <img src="assets/photo.svg" alt="photo" />
          </div>
          <div class="item-list__info">
            <div class="item-list__info-name">2번 상품</div>
            <div class="item-list__info-loc">지역5</div>
            <div class="item-list__info-price">200만원</div>
          </div>
        </div>
        <div class="item-list">
          <div class="item-list__img">
            <img src="assets/photo.svg" alt="photo" />
          </div>
          <div class="item-list__info">
            <div class="item-list__info-name">3번 상품</div>
            <div class="item-list__info-loc">지역4</div>
            <div class="item-list__info-price">300만원</div>
          </div>
        </div>
        <div class="item-list">
          <div class="item-list__img">
            <img src="assets/photo.svg" alt="photo" />
          </div>
          <div class="item-list__info">
            <div class="item-list__info-name">4번 상품</div>
            <div class="item-list__info-loc">지역3</div>
            <div class="item-list__info-price">400만원</div>
          </div>
        </div>
        <div class="item-list">
          <div class="item-list__img">
            <img src="assets/photo.svg" alt="photo" />
          </div>
          <div class="item-list__info">
            <div class="item-list__info-name">5번 상품</div>
            <div class="item-list__info-loc">지역2</div>
            <div class="item-list__info-price">500만원</div>
          </div>
        </div>
        <div class="item-list">
          <div class="item-list__img">
            <img src="assets/photo.svg" alt="photo" />
          </div>
          <div class="item-list__info">
            <div class="item-list__info-name">6번 상품</div>
            <div class="item-list__info-loc">지역1</div>
            <div class="item-list__info-price">600만원</div>
          </div>
        </div>
      </div>
      <div class="write-btn">+ 글쓰기</div>
    </main>

    <footer>
      <div class="footer-box">
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/home.svg" alt="Home" />
          </div>
          <div>홈</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/newspaper.svg" alt="Newspaper" />
          </div>
          <div>동네생활</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/map.svg" alt="Map" />
          </div>
          <div>내 근처</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/chat.svg" alt="Chat" />
          </div>
          <div>채팅</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/user.svg" alt="User" />
          </div>
          <div>나의 당근</div>
        </div>
      </div>
    </footer>
  </body>
</html>
